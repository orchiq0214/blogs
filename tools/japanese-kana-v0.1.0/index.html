<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かな练习 · 日语假名记忆</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#1d2b35;background:#f4f7f6;--ink:#1d2b35;--muted:#71808a;--line:#e2ebe8;--soft:#f7faf9;--green:#287a6d;--green-light:#e1f0ed;--red:#c85d4c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7f6}button,input,select{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100vw - 48px));margin:28px auto;padding:0 34px 28px;background:#fff;border:1px solid #edf2f0;border-radius:16px;box-shadow:0 18px 48px #1c293516}.topbar,.setup-footer,.session-head,.session-foot{display:flex;align-items:center;justify-content:space-between}.topbar{min-height:92px;border-bottom:1px solid var(--line)}h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:28px}.eyebrow,.label{color:var(--green);font-size:11px;font-weight:800;letter-spacing:1.2px}.muted,.top-status,.note,.hint,.session-foot{color:var(--muted);font-size:13px}.setup{padding-top:28px}.setup-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.setup-title h2{margin-top:7px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}fieldset{min-width:0;padding:20px;border:1px solid var(--line);border-radius:12px}legend{padding:0 8px;color:var(--green);font-size:14px;font-weight:800}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice,.seg{display:flex;align-items:center;gap:8px;min-height:49px;padding:0 12px;border:1px solid var(--line);border-radius:8px}.choice input,.seg input{position:absolute;opacity:0}.choice span,.seg span{font-size:14px;font-weight:650}.choice small{margin-left:auto;color:var(--muted);font-size:11px}.choice.on,.seg.on{border-color:#77bbae;background:var(--green-light);color:var(--green)}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg{justify-content:center;min-height:40px}.setting{display:flex;align-items:center;justify-content:space-between;min-height:51px;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting-name{color:var(--muted);font-size:13px}select{min-width:145px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:#fff}.setup-footer{padding-top:22px}.primary,.secondary,.text-btn{border-radius:8px;transition:.15s ease}.primary,.secondary{min-height:42px;padding:0 16px;border:1px solid transparent;font-weight:700}.primary{color:#fff;background:var(--green)}.secondary{color:var(--ink);border-color:#cbd9d5;background:#fff}.primary:hover,.secondary:hover{transform:translateY(-1px);box-shadow:0 5px 12px #287a6d26}.text-btn{padding:0;border:0;color:var(--green);background:transparent;font-size:13px}.hidden{display:none!important}.session{padding-top:22px}.session-head{margin-bottom:12px}.session-meta{display:flex;gap:18px;color:var(--muted);font-size:13px}.progress{height:7px;overflow:hidden;border-radius:5px;background:#e8eeee}.progress i{display:block;width:0;height:100%;border-radius:inherit;background:#5eb7a4}.layout{display:grid;grid-template-columns:1.55fr .95fr;gap:20px;margin-top:22px}.card,.details{min-height:340px;padding:28px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.card{display:flex;flex-direction:column;align-items:center;justify-content:center}.kana{margin:13px 0 8px;font-family:"Yu Gothic","Noto Sans JP",sans-serif;font-size:170px;line-height:1;font-weight:600}.romaji{color:var(--green);font-size:29px;font-weight:800}.hint{margin-top:27px}.details{display:flex;flex-direction:column;gap:18px}.detail{padding-bottom:15px;border-bottom:1px solid #dfe9e6}.detail:last-of-type{border:0}.detail-copy{margin-top:9px;font-size:15px;line-height:1.7}.example{display:grid;grid-template-columns:65px 1fr;gap:7px;margin-top:9px;align-items:baseline}.example-word{font-family:"Yu Gothic","Noto Sans JP",sans-serif;font-size:20px}.example-meta{color:var(--muted);font-size:13px}.wide{width:100%;margin-top:auto}.session-foot{padding-top:18px}.exam{margin-top:18px;padding:19px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.answer-row{display:flex;gap:9px;margin-top:9px}.answer-row input{flex:1;min-width:0;padding:10px 11px;border:1px solid #cbd9d5;border-radius:8px;outline:0}.answer-row input:focus{border-color:var(--green);box-shadow:0 0 0 3px #287a6d1f}.feedback{min-height:27px;padding-top:11px;font-size:14px;line-height:1.5}.correct{color:var(--green)}.wrong{color:var(--red)}.summary{max-width:620px;margin:0 auto;padding:90px 0;text-align:center}.score{margin:18px 0 8px;color:var(--green);font-size:72px;font-weight:800}.summary p:not(.eyebrow){color:var(--muted);line-height:1.7}.summary-actions{display:flex;justify-content:center;gap:10px;margin-top:25px}.vertical .layout{grid-template-columns:1fr;gap:13px}.vertical .card{min-height:235px}.vertical .kana{font-size:125px}.vertical .details{min-height:0;display:grid;grid-template-columns:1fr 1.2fr 1.4fr auto;gap:18px;align-items:center}.vertical .detail{padding:0;border:0}.vertical .wide{width:auto;margin:0}@media(max-width:800px){.shell{width:calc(100vw - 24px);margin:12px auto;padding:0 18px 20px}.grid{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}.setup-title{align-items:start;gap:10px;flex-direction:column}h2{font-size:23px}.topbar{min-height:78px}.layout{grid-template-columns:1fr}.vertical .details{grid-template-columns:1fr 1fr}.vertical .detail:nth-child(3){grid-column:1/-1}.vertical .wide{grid-column:1/-1}.session-foot{gap:9px}.session-foot span{display:none}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div><p class="eyebrow">JAPANESE KANA</p><h1>かな练习</h1></div><span class="top-status" id="topStatus">选择内容开始</span></header>
<section id="setup" class="setup"><div class="setup-title"><div><p class="eyebrow">START A SESSION</p><h2>选择今天要练什么</h2></div><p class="note">本次练习不会保存记录</p></div>
<div class="grid"><fieldset><legend>内容</legend><div class="choices">
<label class="choice on"><input type="radio" name="content" value="hiragana" checked><span>平假名</span><small>默认</small></label>
<label class="choice"><input type="radio" name="content" value="katakana"><span>片假名</span><small>外来词</small></label>
<label class="choice"><input type="radio" name="content" value="both"><span>平片对照</span><small>同音辨认</small></label>
<label class="choice"><input type="radio" name="content" value="dakuten"><span>浊音 / 半浊音</span><small>が・ぱ</small></label>
<label class="choice"><input type="radio" name="content" value="special"><span>拗音</span><small>きゃ・しゅ</small></label>
<label class="choice"><input type="radio" name="content" value="confusion"><span>易错字混淆</span><small>成组练习</small></label>
</div></fieldset>
<fieldset><legend>玩法与布局</legend><div class="segmented"><label class="seg on"><input type="radio" name="mode" value="study" checked><span>背诵</span></label><label class="seg"><input type="radio" name="mode" value="exam"><span>考试</span></label></div>
<div class="setting"><span class="setting-name">考试方向</span><select id="direction"><option value="kana-to-romaji">假名 → 罗马音</option><option value="romaji-to-kana">罗马音 → 假名</option><option value="mixed">混合</option></select></div>
<div class="setting"><span class="setting-name">题量</span><select id="count"><option value="10">10 张</option><option value="20">20 张</option><option value="all">全部</option></select></div>
<div class="setting"><span class="setting-name">布局</span><div class="segmented"><label class="seg on"><input type="radio" name="orientation" value="horizontal" checked><span>横屏</span></label><label class="seg"><input type="radio" name="orientation" value="vertical"><span>竖屏</span></label></div></div>
</fieldset></div><div class="setup-footer"><p class="muted" id="selectionHint">平假名 · 可切换横屏 / 竖屏布局</p><button class="primary" id="start">开始练习 →</button></div></section>
<section id="session" class="session hidden"><div class="session-head"><button class="text-btn" id="back">← 重新选择</button><div class="session-meta"><span id="sessionTitle"></span><span id="progressLabel"></span></div></div><div class="progress"><i id="progressBar"></i></div>
<div class="layout" id="layout"><article class="card"><p class="label" id="promptLabel">当前假名</p><div class="kana" id="prompt"></div><div class="romaji hidden" id="cardAnswer"></div><p class="hint">← 上一张　→ 下一张</p></article><aside class="details"><div class="detail hidden" id="answerDetail"><p class="label">罗马音</p><div class="romaji" id="romaji"></div></div><div class="detail hidden" id="mnemonicDetail"><p class="label">记忆秘诀</p><p class="detail-copy" id="mnemonic"></p></div><div class="detail hidden" id="exampleDetail"><p class="label">例词</p><div id="examples"></div></div><button class="secondary wide" id="reveal">显示秘诀</button></aside></div>
<div class="exam hidden" id="exam"><p class="label" for="answerInput">你的答案</p><div class="answer-row"><input id="answerInput" autocomplete="off" spellcheck="false" placeholder="输入罗马音"><button class="primary" id="submit">提交</button></div><div class="feedback" id="feedback"></div></div>
<div class="session-foot"><button class="secondary" id="prev">← 上一张</button><span>本次练习不会保存记录</span><button class="primary" id="next">下一张 →</button></div></section>
<section id="summary" class="summary hidden"><p class="eyebrow">SESSION COMPLETE</p><h2>本次练习完成</h2><div class="score" id="score">0%</div><p id="summaryText"></p><div class="summary-actions"><button class="secondary" id="again">再练一次</button><button class="primary" id="special">去做专项练习</button></div></section>
</main>
<script>
(function(){
const basic=[['あ','a','张开嘴说“啊”','あさ','asa','早上'],['い','i','两根并排短线','いす','isu','椅子'],['う','u','嘴型轻轻收拢','うえ','ue','上面'],['え','e','像一个人转身','えき','eki','车站'],['お','o','多了一圈','おかし','okashi','点心'],['か','ka','像“加”的简化形','かさ','kasa','伞'],['き','ki','像钥匙轮廓','き','ki','树'],['く','ku','像张开的鸟嘴','くに','kuni','国家'],['け','ke','像打开的叉子','けさ','kesa','今天早上'],['こ','ko','两条平行线','ここ','koko','这里'],['さ','sa','一条弯钩','さかな','sakana','鱼'],['し','shi','一条下滑的弯线','すし','sushi','寿司'],['す','su','线穿过一个圈','すし','sushi','寿司'],['せ','se','像一个人侧身','せかい','sekai','世界'],['そ','so','折起的丝带','そこ','soko','那里'],['た','ta','像一个人在挥手','たこ','tako','章鱼'],['ち','chi','弯钩，注意不是 tsu','ちち','chichi','父亲'],['つ','tsu','小杯子，注意不是 tus','つき','tsuki','月亮'],['て','te','像一只伸开的手','て','te','手'],['と','to','一根竖着的棍子','とけい','tokei','钟表'],['な','na','像一个人弯腰','なつ','natsu','夏天'],['に','ni','两根并排的线','にく','niku','肉'],['ぬ','nu','打结的绳圈','ぬの','nuno','布'],['ね','ne','线绕了一个结','ねこ','neko','猫'],['の','no','一个圆圈','のむ','nomu','喝'],['は','ha','两条线汇合','はな','hana','花'],['ひ','hi','伸手比 hi','ひと','hito','人'],['ふ','fu','富士山的轮廓','ふね','fune','船'],['へ','he','像山谷','へや','heya','房间'],['ほ','ho','像一棵小树','ほん','hon','书'],['ま','ma','张开的结','まめ','mame','豆子'],['み','mi','三条波纹','みみ','mimi','耳朵'],['む','mu','牛角弯成的圈','むし','mushi','虫'],['め','me','打结的眼睛','め','me','眼睛'],['も','mo','两条线缠在一起','もの','mono','东西'],['や','ya','张开手臂','やま','yama','山'],['ゆ','yu','像鱼钩','ゆめ','yume','梦'],['よ','yo','倒扣的杯子','よる','yoru','夜晚'],['ら','ra','轻轻弹起的线','さくら','sakura','樱花'],['り','ri','两片叶子','とり','tori','鸟'],['る','ru','小旋涡','はる','haru','春天'],['れ','re','线向下弯','これ','kore','这个'],['ろ','ro','一个转角','いろ','iro','颜色'],['わ','wa','一个弯腰的人','わたし','watashi','我'],['を','wo','写作 を，助词中通常读 o','これを','kore o','这个（宾语）'],['ん','n','收尾的线','ほん','hon','书']].map(x=>({kana:x[0],romaji:x[1],mnemonic:x[2],examples:[{word:x[3],romaji:x[4],meaning:x[5]}],type:'hiragana'}));
const kataMap={'あ':'ア','い':'イ','う':'ウ','え':'エ','お':'オ','か':'カ','き':'キ','く':'ク','け':'ケ','こ':'コ','さ':'サ','し':'シ','す':'ス','せ':'セ','そ':'ソ','た':'タ','ち':'チ','つ':'ツ','て':'テ','と':'ト','な':'ナ','に':'ニ','ぬ':'ヌ','ね':'ネ','の':'ノ','は':'ハ','ひ':'ヒ','ふ':'フ','へ':'ヘ','ほ':'ホ','ま':'マ','み':'ミ','む':'ム','め':'メ','も':'モ','や':'ヤ','ゆ':'ユ','よ':'ヨ','ら':'ラ','り':'リ','る':'ル','れ':'レ','ろ':'ロ','わ':'ワ','を':'ヲ','ん':'ン'};
const katakana=basic.map(x=>({...x,kana:kataMap[x.kana],type:'katakana'}));
const confusion=[['し','ち','つ'],['す','せ'],['ぬ','め'],['れ','ね'],['さ','き'],['そ','ん'],['は','ほ'],['あ','お'],['る','ろ']];
const voiced='がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ';const voicedRomaji='ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po'.split(' ');const dakuten=[...voiced].map((kana,i)=>({kana,romaji:voicedRomaji[i],mnemonic:'浊点或半浊点改变了基础音，把符号和声音一起记住。',examples:[],type:'hiragana'}));
const special='きゃ kya きゅ kyu きょ kyo しゃ sha しゅ shu しょ sho ちゃ cha ちゅ chu ちょ cho にゃ nya にゅ nyu にょ nyo'.split(' ');const specialData=[];for(let i=0;i<special.length;i+=2)specialData.push({kana:special[i],romaji:special[i+1],mnemonic:'小写 ゃ、ゅ、ょ 和前面的 i 段假名合成一个音节。',examples:[],type:'hiragana'});
const S={settings:null,cards:[],index:0,revealed:false,answered:false,results:[],retry:[],queued:new Set()};const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const norm=s=>s.trim().toLowerCase().replace(/[\s-]/g,'');
function selected(name){return document.querySelector('input[name="'+name+'"]:checked').value}function pool(content){if(content==='hiragana')return basic;if(content==='katakana')return katakana;if(content==='both')return basic.concat(katakana);if(content==='dakuten')return dakuten;if(content==='special')return specialData;if(content==='confusion'){const set=new Set(confusion.flat());return basic.filter(x=>set.has(x.kana))}return basic}
function settings(){const n=$('count').value;return{content:selected('content'),mode:selected('mode'),direction:$('direction').value,count:n==='all'?Infinity:Number(n),orientation:selected('orientation')}}function refreshChoices(){document.querySelectorAll('.choice,.seg').forEach(x=>x.classList.toggle('on',x.querySelector('input').checked));$('selectionHint').textContent=selected('content')==='confusion'?'易错字混淆专项 · 只在本次练习中生效':selected('content')+' · 可切换横屏 / 竖屏布局'}
function start(cfg){S.settings=cfg;const p=shuffle(pool(cfg.content));S.cards=(cfg.count===Infinity?p:p.slice(0,Math.min(cfg.count,p.length))).map(x=>({...x,direction:cfg.mode==='exam'&&cfg.direction==='mixed'?(Math.random()>.5?'kana-to-romaji':'romaji-to-kana'):cfg.direction}));S.index=0;S.revealed=false;S.answered=false;S.results=[];S.retry=[];S.queued=new Set();document.body.classList.toggle('vertical',cfg.orientation==='vertical');$('setup').classList.add('hidden');$('summary').classList.add('hidden');$('session').classList.remove('hidden');render()}
function render(){const x=S.cards[S.index],exam=S.settings.mode==='exam',reverse=exam&&x.direction==='romaji-to-kana',show=exam?S.answered:S.revealed;$('sessionTitle').textContent=(x.type==='katakana'?'片假名':'平假名')+' · '+(exam?'考试':'背诵');$('progressLabel').textContent=(S.index+1)+' / '+S.cards.length;$('progressBar').style.width=((S.index+1)/S.cards.length*100)+'%';$('promptLabel').textContent=reverse?'罗马音':'当前假名';$('prompt').textContent=reverse?x.romaji:x.kana;$('romaji').textContent=x.romaji;$('cardAnswer').textContent=x.romaji;$('cardAnswer').classList.toggle('hidden',exam||!S.revealed);$('answerDetail').classList.toggle('hidden',!show);$('mnemonicDetail').classList.toggle('hidden',!show);$('exampleDetail').classList.toggle('hidden',!show);$('mnemonic').textContent=x.mnemonic;$('examples').innerHTML=x.examples.length?x.examples.map(e=>'<div class="example"><span class="example-word">'+e.word+'</span><span class="example-meta">'+e.romaji+' · '+e.meaning+'</span></div>').join(''):'<span class="muted">先记住这个音节的组合方式。</span>';$('reveal').classList.toggle('hidden',exam||S.revealed);$('exam').classList.toggle('hidden',!exam);$('answerInput').placeholder=reverse?'输入假名':'输入罗马音';$('answerInput').value='';$('feedback').textContent='';$('feedback').className='feedback';S.answered=false;if(exam)$('answerInput').focus()}
function move(delta){S.index=(S.index+delta+S.cards.length)%S.cards.length;S.revealed=false;render()}function next(){if(S.settings.mode==='exam'&&!S.answered)return;if(S.index<S.cards.length-1)return move(1);if(S.settings.mode==='exam'&&S.retry.length){const extra=S.retry.splice(0);S.cards=S.cards.concat(extra);return move(1)}if(S.settings.mode==='exam')return finish();move(-S.index)}
function submit(){if(S.settings.mode!=='exam'||S.answered)return;const x=S.cards[S.index],expected=norm(x.direction==='romaji-to-kana'?x.kana:x.romaji),actual=norm($('answerInput').value),ok=actual===expected;S.answered=true;S.results.push({x,ok});if(!ok&&!S.queued.has(x.kana+x.type)){S.queued.add(x.kana+x.type);S.retry.push(x)}$('feedback').className='feedback '+(ok?'correct':'wrong');$('feedback').innerHTML=ok?'回答正确。':'正确答案是 <strong>'+expected+'</strong>。';renderFeedback(x)}
function renderFeedback(x){$('mnemonic').textContent=x.mnemonic;$('answerDetail').classList.remove('hidden');$('mnemonicDetail').classList.remove('hidden');$('exampleDetail').classList.remove('hidden');$('reveal').classList.add('hidden');$('feedback').className+=' '+(S.results.at(-1).ok?'correct':'wrong')}
function finish(){const total=S.results.length,good=S.results.filter(x=>x.ok).length,wrong=S.results.filter(x=>!x.ok).map(x=>x.x.kana);$('score').textContent=total?Math.round(good/total*100)+'%':'0%';$('summaryText').textContent=wrong.length?'本次需要再练：'+wrong.join('、')+'。可以进入易错字混淆专项。':'本次没有错题，可以继续扩大练习范围。';$('session').classList.add('hidden');$('summary').classList.remove('hidden')}
document.querySelectorAll('input[type="radio"]').forEach(x=>x.addEventListener('change',refreshChoices));$('start').onclick=()=>start(settings());$('back').onclick=()=>{$('session').classList.add('hidden');$('setup').classList.remove('hidden')};$('prev').onclick=()=>move(-1);$('next').onclick=next;$('reveal').onclick=()=>{S.revealed=true;render()};$('submit').onclick=submit;$('answerInput').onkeydown=e=>{if(e.key==='Enter')submit()};$('again').onclick=()=>start(S.settings);$('special').onclick=()=>{$('summary').classList.add('hidden');$('setup').classList.remove('hidden');document.querySelector('input[value="confusion"]').checked=true;refreshChoices()};document.onkeydown=e=>{if(e.target.matches('input,select,textarea')||$('session').classList.contains('hidden'))return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();next()}};refreshChoices();
})();
</script>
</body>
</html>
